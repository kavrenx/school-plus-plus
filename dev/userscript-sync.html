<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Локальная синхронизация — School++</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      body {
        max-width: 680px;
        margin: auto;
        padding: 24px 20px;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        font: inherit;
        min-height: 44px;
        padding: 8px 12px;
        margin: 4px 8px 4px 0;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #888;
        padding: 12px;
      }
      a {
        display: inline-block;
        padding: 10px 0;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Локальная синхронизация</h1>
    <p>
      Переход в госдневник → сбор → возврат → проверка и сохранение на этом
      устройстве. Supabase в этой проверке не используется.
    </p>
    <p>
      Используй уже установленный «School++ — тест на iPhone». Оставайся в той
      же вкладке Safari.
    </p>
    <p id="status" role="status" aria-live="polite">Готово к проверке.</p>
    <button id="start" type="button">Запустить синхронизацию</button>
    <button id="retry" type="button" hidden>Повторить получение</button>
    <button id="copy" type="button" hidden>Скопировать замеры</button>
    <p>
      <a id="diary" href="/?ios-import=preview#diary" hidden
        >Открыть локальный дневник</a
      >
    </p>
    <pre
      id="report"
      tabindex="0"
      aria-label="Замеры локальной синхронизации"
      hidden
    ></pre>
    <script type="module">
      import { createUserscriptClient } from "/js/userscript-client.js";
      import {
        createSafeStorage,
        getBrowserStorage,
      } from "/js/safe-storage.js";
      import { writeClipboardText } from "/js/clipboard.js";
      import { createLocalUserscriptRoundtrip } from "./userscript-roundtrip.js";

      if (!import.meta.env.DEV) throw new Error("Local development only");
      // Enable a local timing report on first entry, preserved across the trip.
      if (!location.search.includes("syncTiming=")) {
        const url = new URL(location.href);
        url.searchParams.set("syncTiming", "1");
        history.replaceState(null, "", url);
      }
      const flow = createLocalUserscriptRoundtrip({
        windowRef: window,
        storage: createSafeStorage(getBrowserStorage(window)),
        client: createUserscriptClient(window),
      });
      const status = document.getElementById("status");
      const start = document.getElementById("start");
      const retry = document.getElementById("retry");
      const copy = document.getElementById("copy");
      const report = document.getElementById("report");
      const diary = document.getElementById("diary");
      let busy = false;
      async function run(returning) {
        if (busy) return;
        busy = true;
        start.disabled = retry.disabled = true;
        diary.hidden = true;
        status.textContent = returning
          ? "Получаем и проверяем дневник…"
          : "Проверяем Userscripts и открываем госдневник…";
        try {
          await flow[returning ? "receive" : "start"]();
          if (returning) {
            status.textContent =
              "Готово: полный результат проверен и сохранён локально. В облако данные не отправлялись.";
            diary.hidden = false;
            retry.hidden = true;
          }
        } catch (error) {
          status.textContent = error.message;
          retry.hidden = !returning;
        } finally {
          report.textContent = flow.report();
          report.hidden = copy.hidden = false;
          start.disabled = retry.disabled = false;
          busy = false;
        }
      }
      start.addEventListener("click", () => void run(false));
      retry.addEventListener("click", () => void run(true));
      copy.addEventListener("click", async () => {
        try {
          await writeClipboardText(report.textContent, window);
          status.textContent = "Замеры скопированы.";
        } catch {
          const range = document.createRange();
          range.selectNodeContents(report);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          status.textContent = "Замеры выделены. Скопируй их вручную.";
        }
      });
      if (new URLSearchParams(location.search).get("returned") === "1")
        void run(true);
    </script>
  </body>
</html>
